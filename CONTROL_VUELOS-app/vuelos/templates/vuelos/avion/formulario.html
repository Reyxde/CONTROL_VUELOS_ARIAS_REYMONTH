{% extends 'vuelos/base.html' %}
{% block title %}{% if avion %}Editar avión{% else %}Crear avión{% endif %}{% endblock %}
{% block content %}
<h2>{% if avion %}Editar avión{% else %}Nuevo avión{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'avion_list' %}">Cancelar</a>
</form>
{% endblock %}
