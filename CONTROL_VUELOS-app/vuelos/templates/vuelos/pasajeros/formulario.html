{% extends 'vuelos/base.html' %}
{% block title %}{% if pasajero %}Editar pasajero{% else %}Crear pasajero{% endif %}{% endblock %}
{% block content %}
<h2>{% if pasajero %}Editar pasajero{% else %}Nuevo pasajero{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'pasajero_list' %}">Cancelar</a>
</form>
{% endblock %}
