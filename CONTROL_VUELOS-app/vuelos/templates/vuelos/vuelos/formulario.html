{% extends 'vuelos/base.html' %}
{% block title %}{% if vuelo %}Editar vuelo{% else %}Crear vuelo{% endif %}{% endblock %}
{% block content %}
<h2>{% if vuelo %}Editar vuelo{% else %}Nuevo vuelo{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'vuelo_list' %}">Cancelar</a>
</form>
{% endblock %}
