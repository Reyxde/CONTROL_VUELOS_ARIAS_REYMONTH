{% extends 'vuelos/base.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<h2>Crear cuenta</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Registrarme</button>
</form>
<p>¿Ya tiene cuenta? <a href="{% url 'login' %}">Inicie sesión</a></p>
{% endblock %}
